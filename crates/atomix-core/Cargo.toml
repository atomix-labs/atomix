[package]
name                   = "atomix-core"
description            = "the typed atomic of atomix, the values it holds, and the orderings and primitives under it."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/**/*.rs", "tests/compile_pass/*.rs"]

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "arm64ec-pc-windows-msvc",
]
cargo-args = [
    "--config",
    'target.x86_64-unknown-linux-gnu.rustflags = ["-C", "target-cpu=x86-64-v3"]',
    "--config",
    'target.x86_64-apple-darwin.rustflags = ["-C", "target-cpu=x86-64-v3"]',
    "--config",
    'target.x86_64-pc-windows-msvc.rustflags = ["-C", "target-cpu=x86-64-v3"]',
]

[features]
default       = []
arbitrary     = ["dep:arbitrary"]
arbitrary-int = ["dep:arbitrary-int"]
bytemuck      = ["dep:bytemuck"]
deranged-05   = ["dep:deranged"]
loom          = ["dep:loom", "dep:tracing", "dep:tracing-subscriber"]
serde         = ["dep:serde_core"]
std           = []
zerocopy-08   = ["dep:zerocopy"]

[lints]
workspace = true

[dependencies]
# external
arbitrary     = { workspace = true, optional = true }
arbitrary-int = { workspace = true, optional = true }
bytemuck      = { workspace = true, optional = true }
deranged      = { workspace = true, optional = true }
serde_core    = { workspace = true, optional = true }
zerocopy      = { workspace = true, optional = true }

[dev-dependencies]
# external
arbitrary-int = { workspace = true, features = ["hint"] }
bytemuck      = { workspace = true, features = ["min_const_generics"] }
proptest      = { workspace = true }
serde_json    = { workspace = true }
trybuild      = { workspace = true }

[build-dependencies]
# external
cfg_aliases = { workspace = true }

[target.'cfg(loom)'.dependencies]
# external
loom               = { workspace = true, optional = true }
tracing            = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
