[package]
name                   = "atomix-derive"
description            = "the derives of atomix: `Atom`, and the read-modify-writes a newtype takes from its field."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
keywords               = ["atomic", "derive", "bitfield", "tagged-pointer", "lock-free"]
categories             = ["concurrency", "no-std"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
# internal
atomix-derive-impl = { path = "../derive-impl", version = "=0.2.0" }

[dev-dependencies]
# internal
atomix-core = { workspace = true }
