run-id  = "2026-10-12T17-47Z-4b25246-contention"
purpose = "what an operation costs while 1, 2, 4 and 8 cores contend for its cache line: a shared count, counts side by side or each in a line of its own, 16-byte reads by load and by compare-exchange, and a claim of one bit"

[hardware]
cpu        = "AWS Graviton4 (Arm Neoverse V2, CPU part 0xd4f), c8g.8xlarge"
cores      = 32
cache-line = 64

[environment]
kernel        = "Linux 6.12.53-69.119.amzn2023.aarch64"
clocksource   = "arch_sys_counter"
isolated-cpus = "6-31"
placement     = "taskset -c 20-27, thread i pinned by core_affinity to core 20 + i"

[toolchain]
rustc   = "1.101.0-nightly (d080e7dff 2026-09-27)"
profile = "bench: release's settings, fat LTO, one codegen unit, built to unwind"
flags   = { floor = "the workspace's floor, +crc,+lse", lse2 = "RUSTFLAGS='-C target-cpu=neoverse-v2', which replaces the floor and has LSE2" }

[parameters]
command = "taskset -c 20-27 <bench binary> --bench, the binary cargo bench -p atomix-rs --features derive --bench contention --no-run built, with --target-dir target/lse2 for lse2"
library = "atomix at 4b25246, origin/main; the bench is the commit that adds it"
threads = "1, 2, 4 and 8, each on a core of its own"
rounds  = "500 untimed, a barrier, then 5,000 timed of 1,000 operations each, a thread done early contending on, untimed, until every thread is done"
figures = "each pair the fastest and the slowest thread's median round, in ns an operation; each transcript has the highest p99 and maximum of any thread too"
floor   = "floor-empty is a round of calls to an empty operation through the pointer every case is called through: 0.74 ns"

[notes]
one-line   = "each compared pair, by hand and atomix, shares one run and one cache line: a contended line's time moves by up to a fifth from one run to the next (shared-count at 2 threads: 22.5 ns in floor-1, 19.1 in floor-2), and a pair's two rows move together"
same-code  = "shared-count is ldaddal in both; the claim's set is ldsetal in both, and its clear ldclrl"
padding    = "own-count: eight counts side by side in one line cost 14 to 17 ns an add at 2 threads and 59 to 92 at 8; each in its own CachePadded line, 5.2 ns at every count"
wide-reads = "wide-read: load, ldp and dmb ishld with LSE2, holds 4.1 ns at every count, since readers share the line; load_rmw, caspa, takes the line from every other reader, 15 to 16 ns at 2 threads and 61 to 80 at 8"
one-thread = "at one thread this harness reads load at 4.1 ns and load_rmw at 5.3, where operations reads 6.1 and 5.0: each harness wraps the read in its own loop, and only contention separates the two"

