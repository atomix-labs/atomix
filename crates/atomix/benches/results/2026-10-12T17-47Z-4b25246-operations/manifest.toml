run-id  = "2026-10-12T17-47Z-4b25246-operations"
purpose = "what one operation costs on one thread: atomix's against core's, portable-atomic's, crossbeam's AtomicCell, the atomic crate's, atomig's and atomic_enum's, and against the same bits written by hand over core's atomics"

[hardware]
cpu        = "AWS Graviton4 (Arm Neoverse V2, CPU part 0xd4f), c8g.8xlarge"
cores      = 32
cache-line = 64

[environment]
kernel        = "Linux 6.12.53-69.119.amzn2023.aarch64"
clocksource   = "arch_sys_counter"
isolated-cpus = "6-31"
placement     = "taskset -c 16"

[toolchain]
rustc   = "1.101.0-nightly (d080e7dff 2026-09-27)"
profile = "bench: release's settings, fat LTO, one codegen unit, built to unwind"
flags   = { floor = "the workspace's floor, +crc,+lse", lse2 = "RUSTFLAGS='-C target-cpu=neoverse-v2', which replaces the floor and has LSE2" }

[parameters]
command   = "taskset -c 16 <bench binary> --bench, the binary cargo bench -p atomix-rs --features derive --bench operations --no-run built, with --target-dir target/lse2 for lse2"
library   = "atomix at 4b25246, origin/main; the bench is the commit that adds it"
timer     = "divan 0.1.21's, 29 to 30 ns precise, each sample a batch of operations"
samples   = 100
probes    = "fields and tagged-pointer: each form an #[inline(never)] function of one signature, called from one generic closure; the other groups inline each form into one generic closure"
contended = "none: one thread; contention is the contention run's"

[notes]
by-hand-merged     = "fields: LLVM merged each by-hand function with atomix's, the same code (set: mov; ldsetl; test-and-clear: mov; ldclral; ubfx; or: and; ldsetl; load: ldar; lsr; fetch-add: lsl; ldaddal; lsr), so both rows call one function; tagged-pointer's test-and-set too, mov; ldsetal; ubfx"
loop-rows          = "fields' loop is core's update on the whole word: ldr or ldar, then a casl or casal loop, 1.3 to 2.4 ns more than one instruction; its load is a load, merged with the others"
tagged-store       = "atomix's store is tst; b.ne; add; stlr, against orr; stlr by hand: the one test and branch a tagged pointer's encode costs, 0.10 to 0.13 ns"
tagged-exchange    = "atomix's compare-exchange tests both pointers in one orr; tst; b.ne before casal: 0.27 to 0.30 ns"
tagged-load        = "atomix's load is ldar; and; and; ubfx, with no ands and csel, which by hand's NonNull::new adds to test for null again; the two are equal at the floor, and with LSE2 atomix's is 0.3 ns slower though shorter, adding no instruction: the two differ in the order they write the returned tuple, by hand its bool with strb before its two words with stp, atomix after"
enum-load          = "atomix: ldarb, no check; core by hand: ldarb; cmp #3; csel; atomig: ldarb; cmp #4; b.hs to a panic; atomic_enum: ldar of its usize; cmp #4; b.hs to a panic"
integer-bimodal    = "a store is 2.0 or 3.2 ns, and a swap, fetch-add or compare-exchange moves by up to 0.8 ns, from run to run in every crate alike: the same instruction in each, so a row's spread is the machine's"
crossbeam-exchange = "crossbeam's u64 compare-exchange is 0.6 to 0.8 ns slower than core's: AtomicCell's is a loop of core's weak one, which retries where the value found equals current but its bytes do not"
packed-locks       = "the quote is 8 bytes aligned to 4: every operation of crossbeam's AtomicCell goes through its striped seqlock, a load reading optimistically and locking only where a write overlaps it, and every operation of the atomic crate takes its spinlock, load included"
two-word-reads     = "atomix's read is load_rmw, caspa, at both floors; portable-atomic's load is a call through a pointer it sets at run time, to ldp and a barrier on a CPU with LSE2, as this one has; atomix's load, ldp and dmb ishld with LSE2, is no faster on one thread, 6.1 ns against load_rmw's 5.0"
two-word-writes    = "atomix's write is store_rmw, a casp then a caspl loop; portable-atomic's store finds LSE2 at run time and is stp. With LSE2, atomix's store is portable-atomic's write loop byte for byte, dmb ish then stp, at 5.74 and 5.71 ns against 5.26 and 5.23: the gap is the harness's, and the two benches run alone with a fixed --sample-size of 256 to 409600 both read 5.2 to 5.3 ns. atomix's u128 loop compares with two eor and an orr where the double word's uses cmp and ccmp, 2.4% apart at the floor"

