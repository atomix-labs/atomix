run-id  = "2026-10-19T08-41Z-423b1e5-values"
purpose = "what the values cost on one thread: an array's element at a run-time index against its mask by hand and bit_set, four bytes against a u32, and a shared reference against AtomicPtr"

[hardware]
cpu        = "AWS Graviton4 (Arm Neoverse V2, CPU part 0xd4f), c8g.8xlarge"
cores      = 32
cache-line = 64

[environment]
kernel        = "Linux 6.12.53-69.119.amzn2023.aarch64"
clocksource   = "arch_sys_counter"
isolated-cpus = "6-31"
placement     = "taskset -c 16"

[toolchain]
rustc   = "1.101.0-nightly (d080e7dff 2026-09-27)"
profile = "bench: release's settings, fat LTO, one codegen unit, built to unwind"
flags   = { floor = "the workspace's floor, +crc,+lse", lse2 = "RUSTFLAGS='-C target-cpu=neoverse-v2', which replaces the floor and has LSE2" }

[parameters]
command   = "taskset -c 16 <bench binary> --bench arrays references, the binary cargo bench -p atomix-rs --features derive --bench operations --no-run built, with --target-dir target/lse2 for lse2"
library   = "atomix at 423b1e5, feat/values' tip, whose code for each operation the groups time is c66784e's, the base this lands on, as those operations' codegen pins show; the groups are the commit that adds them"
timer     = "divan 0.1.21's, 30 ns precise, each sample a batch of operations"
samples   = 100
probes    = "each form an #[inline(never)] function of one signature, called from one generic closure; the worker is index 17 of 64 and the slot index 2 of 4, each through black_box, so known at run time alone"
contended = "none: one thread"

[notes]
element-claim  = "atomix's element(index).test_and_set and its clear are the hand-masked fetch_or and fetch_and after the same check, instruction for instruction on the fast path: cmp #64; b.hs; mov; lsl; ldsetal; tst; cset, and cmp; b.hs; mov; lsl; ldclrl, with LSE2 too; the two differ in the cold call alone, atomix's refuse_index against assert!'s panic_fmt. bit_set masks its index and checks nothing: mov; lsl; ldsetal; tst; cset, a compare and a branch shorter, which the medians do not tell apart"
element-fields = "a slot's written bit at a run-time index, element(index).fields().written.test_and_set, is cmp #4; b.hs; lsl; mov; lsl; ldsetal; tst; cset, and its length's load cmp; b.hs; mov; ldar; orr; lsr (ldapr with LSE2): each the hand mask's, instruction for instruction, the cold call apart"
whole-array    = "[u8; 4]'s load and store are u32's, ldar and stlr (ldapr with LSE2): LLVM merged core's with atomix's, so both rows call one function, and their medians differ by the harness alone"
reference      = "a reference's load, store and swap are AtomicPtr's, ldar, stlr and swpal (ldapr with LSE2): LLVM merged the stores, and the loads and swaps are byte for byte the same; a store is 2.0 or 3.2 ns, and a swap moves by up to 0.4 ns from run to run in either, and 0.6 between them, as integer-bimodal in 2026-10-12T17-47Z-4b25246-operations says"

